<!DOCTYPE html>
<html>
<head>
<title>pulse.xd login</title>
<style>
body{background:#080808;color:#f0f0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}
.box{border:1px solid #1e1e1e;padding:40px;width:360px}
input,button{width:100%;padding:14px;margin-top:12px;background:#111;color:white;border:1px solid #333}
button{background:white;color:#080808;cursor:pointer}
p{color:#777}
</style>
</head>
<body>
<div class="box">
<h1>pulse<span style="color:#555">.xd</span></h1>
<p>Admin login</p>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
async function login(){
  const res = await fetch("/api/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: user.value,
      password: pass.value
    })
  });

  if(res.ok){
    location.href="/server";
  } else {
    msg.textContent="Invalid credentials";
  }
}
</script>
</body>
</html>
