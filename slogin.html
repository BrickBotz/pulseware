<!DOCTYPE html>
<html>
<head>
<title>pulse.xd login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{background:#080808;color:#f0f0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:40px}
.box{border:1px solid #1e1e1e;padding:40px;width:360px;background:#080808}
input,button{width:100%;padding:14px;margin-top:12px;background:#111;color:white;border:1px solid #333;font-size:14px}
button{background:white;color:#080808;cursor:pointer;font-weight:bold}
p{color:#777;line-height:1.6}
@media(max-width:768px){
  body{padding:20px;align-items:flex-start;padding-top:90px}
  .box{width:100%;max-width:100%;padding:24px}
  h1{font-size:2rem}
  input,button{font-size:16px}
}
</style>
</head>
<body>
<div class="box">
<h1>pulse<span style="color:#555">.xd</span></h1>
<p>Admin login</p>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
async function login(){
  const res = await fetch("/api/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username:user.value, password:pass.value })
  });
  if(res.ok) location.href="/server";
  else msg.textContent="Invalid credentials";
}
</script>
</body>
</html>
